<!DOCTYPE html>
<html>
    <head>
        <title>..:JAVASCRIPT 06:..</title>
        <style type="text/css">
            .image-container {
                display:none;
            }
        </style>
        <script>
            function setVisibility(value) {
                document.getElementById("JYP").style.display= value;
            }
        </script>
        </head>
        <body>
            <div class="image-container" id="JYP">
                 <img src="JYP.webp" width="30%" />
            </div>
        
           [ <a href= "javascript:void(0)" onClick="return setVisibility ('block')">Display image</a> |
             <a href="javascript:void(0)" onClick="return setVisibility ('none')">Hide image</a> ]
        </body>
</html>
