<!DOCTYPE html>
<html>
    <head>
        <title>..:JavaScript02:..</title>
        <script>
            function clickMe() {
            
                let firstNum = prompt("Enter 1st number: ");
                let secondNum = prompt("Enter 2nd number: ");
                let sum = parseInt(firstNum) + parseInt(secondNum);
            

                document.getElementById("result").innerHTML = "Sum of  " + firstNum + " and " + secondNum + " = " + sum;
            }
        </script>
    </head>
    <body>
        <button onclick="clickMe()">Click Me to add 2 numbers</button>
        <div id="result">Waiting for the answer</div> 

    </body>
</html>
